<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticated Robot Control</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        min-height: 100vh;
        color: #fff;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 10px;
      }
      .subtitle {
        text-align: center;
        color: #888;
        margin-bottom: 30px;
      }

      /* Auth Section */
      .auth-section {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .auth-section h2 {
        margin-bottom: 15px;
        font-size: 1.2em;
      }
      .auth-section.authenticated {
        border: 2px solid #4ade80;
      }
      .auth-section.unauthenticated {
        border: 2px solid #f87171;
      }

      .key-input {
        width: 100%;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #1a1a2e;
        color: #fff;
        font-family: monospace;
        font-size: 12px;
        margin-bottom: 10px;
      }

      .auth-btn {
        background: #4a9eff;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        width: 100%;
      }
      .auth-btn:hover {
        background: #3b8bdb;
      }
      .auth-btn:disabled {
        background: #555;
        cursor: not-allowed;
      }

      /* Status */
      .status {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }
      .status-item {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        padding: 15px;
        text-align: center;
      }
      .status-label {
        font-size: 12px;
        color: #888;
      }
      .status-value {
        font-size: 18px;
        font-weight: bold;
        margin-top: 5px;
      }
      .status-value.connected {
        color: #4ade80;
      }
      .status-value.disconnected {
        color: #f87171;
      }

      /* Controls */
      .controls {
        display: none;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 20px;
      }
      .controls.visible {
        display: block;
      }
      .controls h2 {
        margin-bottom: 15px;
      }

      .command-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .command-btn {
        background: #333;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .command-btn:hover {
        background: #4a9eff;
      }
      .command-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Log */
      .log {
        background: #111;
        border-radius: 8px;
        padding: 15px;
        margin-top: 20px;
        max-height: 200px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
      }
      .log-entry {
        padding: 3px 0;
      }
      .log-entry.info {
        color: #4a9eff;
      }
      .log-entry.success {
        color: #4ade80;
      }
      .log-entry.error {
        color: #f87171;
      }
      .log-entry.action {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Authenticated Robot Control</h1>
      <p class="subtitle">Ed25519 Challenge-Response Authentication</p>

      <!-- Status -->
      <div class="status">
        <div class="status-item">
          <div class="status-label">WebSocket</div>
          <div class="status-value disconnected" id="wsStatus">
            Disconnected
          </div>
        </div>
        <div class="status-item">
          <div class="status-label">Authentication</div>
          <div class="status-value disconnected" id="authStatus">
            Not Authenticated
          </div>
        </div>
      </div>

      <!-- Auth Section -->
      <div class="auth-section unauthenticated" id="authSection">
        <h2>Step 1: Enter Your Keys</h2>
        <p style="color: #888; margin-bottom: 15px; font-size: 14px">
          Paste your Ed25519 keys below. Generate them with:
          <code>pnpm generate-keys</code>
        </p>

        <label
          style="
            display: block;
            margin-bottom: 5px;
            color: #888;
            font-size: 12px;
          "
          >Private Key (never sent to server!)</label
        >
        <input
          type="password"
          class="key-input"
          id="privateKey"
          placeholder="64 hex characters..."
        />

        <label
          style="
            display: block;
            margin-bottom: 5px;
            color: #888;
            font-size: 12px;
          "
          >Public Key</label
        >
        <input
          type="text"
          class="key-input"
          id="publicKey"
          placeholder="64 hex characters..."
        />

        <button class="auth-btn" id="authBtn" onclick="startAuth()">
          Authenticate
        </button>
      </div>

      <!-- Controls (hidden until authenticated) -->
      <div class="controls" id="controls">
        <h2>Robot Controls</h2>
        <div class="command-grid">
          <button class="command-btn" onclick="sendCommand('sit')">Sit</button>
          <button class="command-btn" onclick="sendCommand('stand')">
            Stand
          </button>
          <button class="command-btn" onclick="sendCommand('balance')">
            Balance
          </button>
          <button class="command-btn" onclick="sendCommand('forward')">
            Forward
          </button>
          <button class="command-btn" onclick="sendCommand('wave')">
            Wave
          </button>
          <button class="command-btn" onclick="sendCommand('backward')">
            Backward
          </button>
          <button class="command-btn" onclick="sendCommand('left')">
            Left
          </button>
          <button class="command-btn" onclick="sendCommand('right')">
            Right
          </button>
        </div>
      </div>

      <!-- Log -->
      <div class="log" id="log"></div>
    </div>

    <!-- Ed25519 Library (noble-ed25519) -->
    <script type="module">
      // Import noble-ed25519 from CDN
      import * as ed from "https://esm.sh/@noble/ed25519@2.0.0";

      // Make available globally
      window.ed25519 = ed;
      window.ed25519Ready = true;

      log("Ed25519 library loaded", "info");

      // Auto-connect
      connect();
    </script>

    <script>
      let ws = null;
      let authenticated = false;
      let pendingChallenge = null;

      function log(message, type = "info") {
        const logEl = document.getElementById("log");
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logEl.appendChild(entry);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function updateStatus() {
        const wsStatus = document.getElementById("wsStatus");
        const authStatus = document.getElementById("authStatus");
        const authSection = document.getElementById("authSection");
        const controls = document.getElementById("controls");

        wsStatus.textContent =
          ws?.readyState === WebSocket.OPEN ? "Connected" : "Disconnected";
        wsStatus.className =
          "status-value " +
          (ws?.readyState === WebSocket.OPEN ? "connected" : "disconnected");

        authStatus.textContent = authenticated
          ? "Authenticated"
          : "Not Authenticated";
        authStatus.className =
          "status-value " + (authenticated ? "connected" : "disconnected");

        authSection.className =
          "auth-section " +
          (authenticated ? "authenticated" : "unauthenticated");
        controls.className = "controls " + (authenticated ? "visible" : "");
      }

      function connect() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${location.host}`;

        log(`Connecting to ${wsUrl}...`);
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          log("WebSocket connected", "success");
          updateStatus();
        };

        ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);

          switch (msg.type) {
            case "welcome":
              log(`Server: ${msg.message}`);
              break;

            case "auth_challenge":
              log(`Received challenge: ${msg.challenge.slice(0, 16)}...`);
              pendingChallenge = msg.challenge;
              await signAndRespond();
              break;

            case "auth_success":
              log("Authentication successful!", "success");
              authenticated = true;
              updateStatus();
              break;

            case "auth_error":
              log(`Auth error: ${msg.message}`, "error");
              break;

            case "action_started":
              log(`Robot: ${msg.description}...`, "action");
              break;

            case "action_completed":
              log(`Robot: Done!`, "success");
              break;

            case "error":
              log(`Error: ${msg.message}`, "error");
              break;
          }
        };

        ws.onclose = () => {
          log("Disconnected", "error");
          authenticated = false;
          updateStatus();
          setTimeout(connect, 3000);
        };

        ws.onerror = () => {
          log("Connection error", "error");
        };
      }

      async function startAuth() {
        const publicKey = document.getElementById("publicKey").value.trim();

        if (!publicKey || publicKey.length !== 64) {
          log("Invalid public key (must be 64 hex chars)", "error");
          return;
        }

        log(`Starting authentication with key: ${publicKey.slice(0, 16)}...`);

        ws.send(
          JSON.stringify({
            type: "auth_start",
            publicKey: publicKey,
          }),
        );
      }

      async function signAndRespond() {
        if (!pendingChallenge) return;

        const privateKeyHex = document
          .getElementById("privateKey")
          .value.trim();

        if (!privateKeyHex || privateKeyHex.length !== 64) {
          log("Invalid private key", "error");
          return;
        }

        if (!window.ed25519Ready) {
          log("Ed25519 library not ready", "error");
          return;
        }

        try {
          // Convert hex to bytes
          const challenge = hexToBytes(pendingChallenge);
          const privateKey = hexToBytes(privateKeyHex);

          // Sign the challenge
          const signature = await window.ed25519.signAsync(
            challenge,
            privateKey,
          );
          const signatureHex = bytesToHex(signature);

          log(`Signed challenge: ${signatureHex.slice(0, 32)}...`);

          // Send response
          ws.send(
            JSON.stringify({
              type: "auth_response",
              signature: signatureHex,
            }),
          );

          pendingChallenge = null;
        } catch (err) {
          log(`Signing error: ${err.message}`, "error");
        }
      }

      function sendCommand(cmd) {
        if (!authenticated) {
          log("Not authenticated!", "error");
          return;
        }

        ws.send(
          JSON.stringify({
            type: "command",
            command: cmd,
          }),
        );
      }

      // Hex helpers
      function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
          bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        }
        return bytes;
      }

      function bytesToHex(bytes) {
        return Array.from(bytes)
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      // Make functions globally available
      window.startAuth = startAuth;
      window.sendCommand = sendCommand;
      window.connect = connect;
    </script>
  </body>
</html>
